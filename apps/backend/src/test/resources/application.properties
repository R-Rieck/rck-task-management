# Use H2 in-memory DB for tests
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# JWT secrets for tests
security.jwt.access-token.secret=29f1a2876dd2ff862625aa84df26d16ac13f4c73de73467e6092cf97536ebdc8
security.jwt.access-token.expiration=900000
security.jwt.refresh-token.secret=65bee930dd4ac6288a098009a9a5bac6b9093f18cb79d808c10b0eacd3313d2b
security.jwt.refresh-token.expiration=604800000

# CORS config for tests
app.cors.allowed-origin-patterns=http://localhost:*
app.cors.allowed-methods=GET,POST,PATCH,PUT,DELETE,OPTIONS
app.cors.allowed-headers=*
app.cors.allow-credentials=false

# Disable mail for tests
spring.mail.host=
spring.mail.port=
